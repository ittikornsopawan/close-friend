services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: close_friend
      POSTGRES_PASSWORD: close_friend
      POSTGRES_DB: close_friend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U close_friend -d close_friend"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # GPU passthrough (if available) — uncomment on a host with an NVIDIA GPU + nvidia-container-toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pulls the default chat model into the `ollama` service's volume
  # on first `docker compose up` (and again any time ollama_data is wiped,
  # e.g. `docker compose down -v`) so worker never hits a missing-model
  # error. OLLAMA_HOST points the bundled `ollama` CLI at the `ollama`
  # service instead of starting its own local server — this container just
  # runs the pull and exits.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Image entrypoint is already `/bin/ollama` — override just the command
    # (default CMD is `serve`), not the entrypoint, or the default CMD gets
    # appended as a stray extra arg to `ollama pull ...`.
    command: ["pull", "qwen2.5:7b-instruct-q4_K_M"]
    depends_on:
      ollama:
        condition: service_healthy

  # One-shot: applies Alembic migrations then seeds the persona table.
  # Mirrors the ollama-pull pattern above — api/worker gate on this
  # completing successfully so neither ever queries a schema that isn't
  # there yet or a persona table with no rows.
  migrate:
    build:
      context: .
      dockerfile: packages/shared/Dockerfile
    environment:
      CF_API_DATABASE_URL: postgresql+psycopg://close_friend:close_friend@postgres:5432/close_friend
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CF_API_DATABASE_URL: postgresql+psycopg://close_friend:close_friend@postgres:5432/close_friend
      CF_API_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    # api never talks to ollama directly — it only enqueues onto redis; see docker-compose `worker`.

  worker:
    build:
      context: .
      dockerfile: app/worker/Dockerfile
    environment:
      CF_WORKER_REDIS_URL: redis://redis:6379/0
      CF_WORKER_OLLAMA_BASE_URL: http://ollama:11434
      CF_WORKER_DATABASE_URL: postgresql+psycopg://close_friend:close_friend@postgres:5432/close_friend
    depends_on:
      redis:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    # scale consumers with: docker compose up -d --scale worker=N

  web:
    build:
      context: .
      dockerfile: app/web/Dockerfile
      args:
        # Baked into the client bundle at build time — the browser (on the
        # host) reaches `api` via its published port, not the container name.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_data:
